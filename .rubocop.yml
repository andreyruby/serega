require:
  - standard

plugins:
  - rubocop-performance
  - rubocop-rspec
  - rubocop-rake
  - rubocop-on-rbs
  - rubocop-thread_safety
  - rubocop-packaging
  - rubocop-md

inherit_gem:
  standard: config/base.yml

AllCops:
  NewCops: enable
  Exclude:
    - .github/**/*
    - coverage/**/*
    - doc/**/*
    - pkg/**/*
    - vendor/bundle/**/*
    - CHANGELOG.md # past entries hold code fragments


Style/FrozenStringLiteralComment:
  Enabled: true

Layout/EmptyLineBetweenDefs:
  DefLikeMacros: [let, let!, subject, subject!]
  AllowAdjacentOneLineDefs: true

RSpec/ExampleLength:
  Enabled: false

RSpec/IndexedLet:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/VerifiedDoubles:
  Enabled: false

# Serializers keep their definition (config, attributes, loaders, caches) in
# class instance variables by design
ThreadSafety/ClassInstanceVariable:
  Enabled: false

# The specs start threads to check serialization from many threads
ThreadSafety/NewThread:
  Exclude:
    - spec/**/*
