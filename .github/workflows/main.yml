name: Ruby

# Pull requests run on pull_request, thus push runs only for master
on:
  push:
    branches: [master]
  pull_request:

# A newer push to a pull request cancels its running checks. Each master
# push gets its own group, thus master runs are never cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    name: Lint
    env:
      BUNDLE_GEMFILE: gemfiles/8.1.gemfile
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v7

      # https://github.com/ruby/setup-ruby
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Install codespell
        run: pipx install codespell==2.4.3

      - name: Check spelling
        run: codespell --skip="./sig,./doc,./coverage,./vendor"

      - name: Check code standards
        run: bundle exec rubocop

      - name: Markdown linter
        run: bundle exec mdl README.md CHEATSHEET.md CHANGELOG.md RELEASE.md docs

      - name: Check documentation table of contents and links
        run: bundle exec rake docs:check

      - name: Check API documentation coverage
        run: bundle exec rake rdoc:coverage

      - name: Validate type signatures
        run: bundle exec rbs -I sig validate

      - name: Check lib against the type signatures
        run: bundle exec steep check

  benchmarks:
    runs-on: ubuntu-24.04
    name: Benchmarks
    env:
      BUNDLE_GEMFILE: gemfiles/8.1.gemfile
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v7

      # https://github.com/ruby/setup-ruby
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Install benchmark gems
        run: BUNDLE_GEMFILE=gemfiles/benchmarks.gemfile bundle install

      - name: Check benchmarks
        run: bundle exec rake benchmarks:check

  build:
    runs-on: ubuntu-24.04
    name: Ruby ${{ matrix.ruby }} (AR ${{ matrix.activerecord }})
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # https://github.com/ruby/setup-ruby
          # ruby head is disabled until bundler fixes Pathname::SEPARATOR_PAT (made private in 4.1.dev)
          # - ruby: "head"
          #   activerecord: "8.1"
          #   experimental: true
          #   bundle_force_ruby_platform: "1"
          # Ruby 4.1 is in preview until its December release; a failure does not fail CI
          - ruby: "4.1.0-preview1"
            activerecord: "8.1"
            experimental: true
          - ruby: "4.0"
            activerecord: "8.1"
            coverage: true
          - ruby: "3.4"
            activerecord: "8.1"
          - ruby: "3.3"
            activerecord: "8.1"
          - ruby: "truffleruby-40.0.0"
            activerecord: "8.1"

    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.activerecord }}.gemfile
      BUNDLE_FORCE_RUBY_PLATFORM: ${{ matrix.bundle_force_ruby_platform || '' }}
      COVERAGE: ${{ matrix.coverage && 'true' || 'false' }}

    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v7

      # https://github.com/ruby/setup-ruby
      - name: Set up Ruby ${{ matrix.ruby }} (AR ${{ matrix.activerecord }})
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec
